<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSCard-Marketer</title>
    <link rel="icon" type="image/vnd.microsoft.icon" href="https://www.prumyslovkaliberec.cz/favicon.ico">
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <main class="main">
        <figure class="card card--marketer">
            <div class="cards">
                <p class="cards__nadpis"><strong>Marketer+</strong></p>
                <p class="cards__popis"><span class="cards__text--barva"><strong>Pokročílé funkce</strong></span> vhodné zejména pro e-shopy. E-mailing založený na datech.</p>
                <p class="cards__cena"><span class="cards__text--barva"><strong>200 Kč</strong></span> měsíčně</p>
                <p class="cards__mesicnicena">nebo 300 Kč při <a href="#" class="cards__text--barva"><strong>měsíční platbě</strong></a></p>
                <a href="#" class="cards__tlacudlo"><strong>Vyzkoušejte zdarma</strong></a>

            <ul class="cards__popisky">
                <li class="cards__popisky--ano"><span class="cards__text--barva"><strong>Neomezené množství e-mailů</strong></span></li>
                <li class="cards__popisky--ano">Drag&drop editor na tvorbu šablon</li>
                <li class="cards__popisky--ano">170+ designových šablon</li>
                <li class="cards__popisky--ano">AI generování předmětů a úpravy textů</li>
                <li class="cards__popisky--ano">Integrace s e-shopy</li>
                <li class="cards__popisky--ne">Slevové kupóny</li>
                <li class="cards__popisky--ne">Automatizace podle chování zákazníka</li>

            </div>
        </figure>
    </main>
</body>
</html>
